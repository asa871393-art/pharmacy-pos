name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Tests, typecheck, screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Screenshots of the POS screen (browser demo mode)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.1 http://localhost:4173
          node scripts/screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
      - name: Publish screenshots to the 'screenshots' branch (for review)
        if: always() && github.event_name == 'push'
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" screenshots

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install
      - name: Rust tests (database, FEFO stock checks, audit chain)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: PharmacyPOS-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
