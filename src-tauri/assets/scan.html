<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#10201d" />
<title>قارئ الباركود — نظام الصيدلية</title>
<style>
  :root { --ink: #10201d; --muted: #4f5d59; --line: #d9dee2; --accent: #0e6b5e; --ok: #e3f0ec; --bad: #a8281e; --bad-soft: #fbe7e4; --warn-soft: #fff3dc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif; background: #eef1ee; color: var(--ink); }
  header { background: var(--ink); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header strong { font-size: 17px; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #3b4a46; white-space: nowrap; }
  .pill.on { background: #1f8a5b; }
  .pill.off { background: var(--bad); }
  main { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; }
  #reader { background: #000; border-radius: 12px; overflow: hidden; min-height: 240px; }
  #reader video { border-radius: 12px; }
  .msg { border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.5; }
  .msg.error { background: var(--bad-soft); color: #5c1a14; }
  .msg.warn { background: var(--warn-soft); color: #5c3a00; }
  .msg.ok { background: var(--ok); color: #09493f; }
  .last { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
  .last .code { font-family: Consolas, ui-monospace, monospace; font-size: 20px; direction: ltr; word-break: break-all; }
  .last.flash { animation: flash 0.6s; }
  @keyframes flash { from { background: #bfe8d6; } to { background: #fff; } }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 46px; border: 1px solid #c9d1cd; border-radius: 10px; padding: 0 12px; font-size: 17px; direction: ltr; text-align: left; }
  button { height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; padding: 0 18px; }
  button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #edf0ee; font-size: 14px; }
  li:last-child { border-bottom: 0; }
  li .c { font-family: Consolas, ui-monospace, monospace; direction: ltr; word-break: break-all; }
  li .s { color: var(--muted); white-space: nowrap; }
  li .s.wait { color: #7a4700; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <strong>قارئ الباركود</strong>
  <span id="status" class="pill">جارٍ الاتصال…</span>
</header>
<main>
  <div id="fatal" class="msg error" hidden></div>
  <div id="reader"></div>
  <div id="camera-msg" class="msg warn" hidden></div>
  <button id="retry" class="secondary" hidden>تشغيل الكاميرا من جديد</button>
  <div id="last" class="last" hidden>
    <div class="hint">آخر باركود أُرسل لشاشة البيع</div>
    <div id="last-code" class="code"></div>
  </div>
  <form id="manual" autocomplete="off">
    <input id="manual-code" inputmode="numeric" placeholder="أو اكتب الباركود هنا" aria-label="إدخال الباركود يدوياً" />
    <button type="submit">إرسال</button>
  </form>
  <ul id="history" hidden></ul>
  <p class="hint">وجّه الكاميرا إلى باركود العبوة. يُضاف الصنف إلى الفاتورة المفتوحة على شاشة البيع.</p>
</main>
<script src="/scan/html5-qrcode.min.js"></script>
<script>
(function () {
  "use strict";
  var token = new URLSearchParams(location.search).get("t") || "";
  var $ = function (id) { return document.getElementById(id); };
  var deviceId = "phone";
  try {
    deviceId = localStorage.getItem("scanner-device") || ("phone-" + Math.random().toString(36).slice(2, 10));
    localStorage.setItem("scanner-device", deviceId);
  } catch (e) { /* private mode: a fixed id is fine */ }

  function fatal(text) {
    $("fatal").textContent = text;
    $("fatal").hidden = false;
  }
  if (!token) {
    fatal("افتح هذه الصفحة بمسح رمز QR الظاهر في شاشة البيع (زر «قارئ الموبايل»).");
    return;
  }

  // ── Connection: every scan is one POST. Unsent scans wait in a queue and go out when the Wi-Fi comes back. ──
  var queue = [];
  var sending = false;
  var revoked = false;
  function setStatus(state) {
    var el = $("status");
    el.className = "pill " + (state === "on" ? "on" : state === "off" ? "off" : "");
    el.textContent = state === "on" ? "متصل بشاشة البيع" : state === "off" ? "غير متصل — إعادة المحاولة" : "جارٍ الاتصال…";
  }
  function headers() {
    return { "content-type": "application/json", "x-scanner-token": token };
  }
  function onUnauthorized() {
    revoked = true;
    setStatus("off");
    fatal("انتهت صلاحية هذا الرابط (أُعيد تشغيل البرنامج). امسح رمز QR من شاشة البيع من جديد.");
  }
  function flush() {
    if (sending || revoked || queue.length === 0) return;
    sending = true;
    var item = queue[0];
    fetch("/api/scan", { method: "POST", headers: headers(), body: JSON.stringify({ code: item.code, device: deviceId }) })
      .then(function (r) {
        if (r.status === 401) return onUnauthorized();
        queue.shift();
        item.li.querySelector(".s").textContent = r.ok ? "أُرسل ✓" : "رُفض";
        item.li.querySelector(".s").className = "s";
        setStatus("on");
      })
      .catch(function () {
        setStatus("off");
        return new Promise(function (res) { setTimeout(res, 2000); });
      })
      .then(function () {
        sending = false;
        flush();
      });
  }
  function ping() {
    if (revoked) return;
    fetch("/api/ping?device=" + encodeURIComponent(deviceId), { headers: headers(), cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) return onUnauthorized();
        setStatus(r.ok ? "on" : "off");
        flush();
      })
      .catch(function () { setStatus("off"); });
  }
  ping();
  setInterval(ping, 3000);

  // ── Feedback ──
  var audio = null;
  function beep() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 1400; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.09);
    } catch (e) { /* no sound */ }
    if (navigator.vibrate) navigator.vibrate(60);
  }

  function send(code) {
    $("last").hidden = false;
    $("last-code").textContent = code;
    $("last").classList.remove("flash"); void $("last").offsetWidth; $("last").classList.add("flash");
    var li = document.createElement("li");
    var c = document.createElement("span"); c.className = "c"; c.textContent = code;
    var s = document.createElement("span"); s.className = "s wait"; s.textContent = "في الانتظار…";
    li.appendChild(c); li.appendChild(s);
    var list = $("history");
    list.hidden = false;
    list.insertBefore(li, list.firstChild);
    while (list.children.length > 8) list.removeChild(list.lastChild);
    queue.push({ code: code, li: li });
    flush();
  }

  // The camera sees the same box many times a second for as long as it is in view. Send it once, and only send
  // the same code again after it has been out of view for a moment (the cashier scans a second unit on purpose).
  var lastCode = "", lastSeen = 0;
  function onCameraScan(text) {
    var now = Date.now();
    var repeat = text === lastCode && now - lastSeen < 1500;
    lastCode = text;
    lastSeen = now;
    if (repeat) return;
    beep();
    send(text);
  }

  $("manual").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("manual-code").value.trim();
    if (v) { beep(); send(v); $("manual-code").value = ""; }
  });

  // ── Camera ──
  if (!window.isSecureContext || !navigator.mediaDevices) {
    $("camera-msg").textContent = "المتصفح لم يسمح بالكاميرا لأن الاتصال غير آمن. افتح الرابط https كما في رمز QR، أو اكتب الباركود يدوياً.";
    $("camera-msg").hidden = false;
    $("reader").hidden = true;
    return;
  }
  var F = Html5QrcodeSupportedFormats;
  var scanner = new Html5Qrcode("reader", {
    verbose: false,
    useBarCodeDetectorIfSupported: true,
    // Retail barcodes plus GS1 DataMatrix, which carries batch and expiry on medicine packs.
    formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.DATA_MATRIX, F.QR_CODE],
  });
  var running = false, starting = false;
  function start() {
    if (running || starting) return;
    starting = true;
    $("camera-msg").hidden = true;
    $("retry").hidden = true;
    scanner
      .start(
        { facingMode: "environment" },
        { fps: 12, qrbox: function (w, h) { return { width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.6) }; } },
        onCameraScan,
        function () { /* no code in this frame */ }
      )
      .then(function () { running = true; })
      .catch(function (err) {
        var name = (err && err.name) || String(err);
        $("camera-msg").textContent = /NotAllowed|Permission/i.test(name)
          ? "لم يُسمح باستخدام الكاميرا. اسمح بها من إعدادات المتصفح ثم اضغط «تشغيل الكاميرا من جديد»."
          : "تعذّر تشغيل الكاميرا (" + name + "). يمكنك كتابة الباركود يدوياً.";
        $("camera-msg").hidden = false;
        $("retry").hidden = false;
      })
      .then(function () { starting = false; });
  }
  function stop() {
    if (!running) return;
    running = false;
    scanner.stop().catch(function () {});
  }
  $("retry").addEventListener("click", start);
  // Phones cut the camera when the screen locks or the user switches apps; pick it up again on return.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop(); else { start(); ping(); }
  });
  window.addEventListener("pagehide", stop);
  start();
})();
</script>
</body>
</html>
