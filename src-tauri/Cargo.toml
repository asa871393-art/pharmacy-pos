[package]
name = "pharmacy-pos"
version = "0.1.0"
description = "Pharmacy sales and inventory system"
edition = "2021"

[lib]
name = "pharmacy_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
# Phone scanner: HTTPS server on the shop Wi-Fi (see phone_scanner.rs).
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
# Cloud sync (see sync.rs): HTTPS calls to the Supabase REST API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Password hashing is far too slow unoptimised; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
